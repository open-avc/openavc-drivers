name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository: the catalog is committed by whoever
# changes a driver, and CI's job is to refuse the change when it wasn't.
permissions:
  contents: read

jobs:
  validate:
    name: Validate drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The validation rules this repo runs are generated copies of the
      # platform's own (scripts/_vendor/). A mismatch means the platform's
      # contract moved: regenerate with scripts/vendor_platform_contract.py
      # and commit the result.
      - name: Vendored platform contract is in sync
        run: python scripts/vendor_platform_contract.py --check

      # The catalog, contract and repo-tooling checks. The checks that load a
      # Python driver skip here (no platform installed) and run in the job below.
      - name: Run the catalog and contract checks
        run: python -m pytest tests/ -v

      # Also fails when the committed catalog no longer matches the driver
      # files. The catalog is what the platform installs from and it carries a
      # checksum per driver file, so a stale entry makes that driver refuse to
      # install — this is the step that stops one landing.
      - name: Validate drivers and the catalog they generate
        run: python scripts/build_index.py --check

  # The checks that load a Python driver run it on the real platform: the
  # connect/disconnect run over every driver with a simulator, the commands and
  # defaults read from each loaded class, the guides' Python examples, and the
  # protocol-math tests in tests/protocol_math/. This job clones the platform
  # for them. It is a separate job so the one above keeps proving the catalog
  # checks need nothing but requirements-dev.txt.
  #
  # OPENAVC_REQUIRE_PLATFORM=1 turns "the platform is missing" from a skip into
  # a failure — a job that meant to provide it and did not would otherwise pass
  # while testing nothing. This mirrors the openavc repo, whose CI clones this
  # library and sets OPENAVC_REQUIRE_DRIVER_CORPUS=1 for the sweeps that need it.
  platform:
    name: Drivers on the real platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Track main rather than a pin: a platform change that breaks a driver
      # should go red here, on the day it appears.
      - name: Clone the OpenAVC platform
        run: git clone --depth 1 https://github.com/open-avc/openavc.git "$RUNNER_TEMP/openavc"

      - name: Install the platform's runtime dependencies
        run: pip install -e "$RUNNER_TEMP/openavc"

      - name: Load and run the drivers on the platform
        env:
          # PYTHONPATH resolves the platform from the same checkout the probe
          # points at, so a module the editable install does not expose is still
          # importable here.
          PYTHONPATH: ${{ runner.temp }}/openavc
          OPENAVC_PLATFORM_ROOT: ${{ runner.temp }}/openavc
          OPENAVC_REQUIRE_PLATFORM: "1"
          OPENAVC_DATA_DIR: ${{ runner.temp }}/openavc-data
        run: |
          python -m pytest \
            tests/test_connect_lifecycle.py \
            tests/test_commands_that_erase_ask_first.py \
            tests/test_driver_defaults_agree.py \
            tests/test_setup_fields_match_their_settings.py \
            tests/test_doc_python_examples.py \
            tests/protocol_math -v
