name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate drivers and check generated catalog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pydantic pytest

      - name: Run driver, simulator, and build_index tests
        run: python -m pytest tests/ -v

      - name: Build index and devices catalogs
        run: python scripts/build_index.py

      - name: Verify generated catalog is in sync with checked-in files
        # `-I` ignores hunks where every change matches the regex — the only
        # field that legitimately changes between runs is generated_at.
        run: |
          if ! git diff --exit-code -I '"generated_at":' -- index.json devices.json index/ devices/; then
            echo ""
            echo "ERROR: Generated catalog files differ from what's checked in."
            echo "Run 'python scripts/build_index.py' locally and commit the result."
            exit 1
          fi
